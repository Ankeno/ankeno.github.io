<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Timer</title>
        <link rel="stylesheet" href="../navBar.css" />
        <script src="../navBar.js" defer></script>
        <style>
            html {
                background-image: url("../images/bg.png");
                height: 100%;
            }

            body {
                margin: 0 auto;
                font-family: "Courier New", Courier, monospace;
                /* background-color: rgb(0, 24, 44); */
                color: aliceblue;
                height: 100%;
                /*max-width: 1360px;*/
            }

            /* header */
            header {
                padding: 10px;
                background-color: rgb(0, 29, 73);
            }
            header p {
                margin: 0;
                text-align: center;
                font-weight: bold;
                font-size: 20px;
            }

            /* main area */
            .mainArea {
                /* height: 100vh; */
                margin: 0 auto;
                box-sizing: border-box;
                max-width: 800px;
                display: flex;
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: center;
            }
            /* settings box */
            .settingsBox {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding-top: 4px;
                padding-bottom: 4px;
            }

            /* start button */
            .startBox {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding-top: 4px;
                padding-bottom: 4px;
            }
            .startButton {
                background-color: darkolivegreen;
                border: 4px solid forestgreen;
                border-radius: 20px;
                /* height: 90%; */
                color: whitesmoke;
                text-align: center;
                font-family: "Courier New", Courier, monospace;
                font-size: 150%;
                font-weight: bold;
                padding-top: 4px;
                padding-bottom: 4px;
                cursor: pointer;
                outline: none;
                transition-duration: 0.5s;
            }
            .startButton:active {
                color: yellow;
                background-color: darkgreen;
                transition-duration: 0.1s;
            }
            /* image area */
            .imgArea {
                width: 200px;
                height: 200px;
                border: 5px solid saddlebrown;
                border-radius: 15px;
                padding: 5px;
                background-color: black;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            @keyframes imgScale {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(0.2);
                }
                100% {
                    transform: scale(1);
                }
            }
            #img {
                width: 100%;
                height: auto;
                animation-name: imgScale;
                animation-duration: 11s;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
                animation-play-state: paused;
            }
        </style>
    </head>

    <body onload="clock()">
        <!--navBar-->
        <div class="navBar" id="navBar">
            <div class="logo" id="logo">Ankeno</div>
            <a href="../index.html">Home</a>
            <a href="../dice/dice.html">Dice Roller</a>
            <a href="../fhtool/fhtool.html">FH Tool</a>
            <a href="timer/timer.html" class="active">Timer</a>
            <div class="clock" id="clock"></div>
            <div
                class="icon"
                id="icon"
                onclick="
                    nav();
                    navBtn();
                "
            >
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>
        </div>

        <!--header-->
        <header>
            <div>
                <p>Interval Timer</p>
            </div>
        </header>

        <!--main-->
        <div class="mainArea">
            <div class="settingsBox">
                <label>Interval(s):</label>
                <input
                    type="number"
                    id="interval"
                    min="1"
                    max="9000"
                    value="5.5"
                    maxlength="4"
                    step="0.5"
                />
            </div>

            <div id="startBox" class="startBox">
                <button class="startButton" id="startButton">Move</button>
            </div>

            <div id="imgArea" class="imgArea">
                <img src="../images/g2.svg" id="img" class="img" />
            </div>
        </div>
        <script>
            const image = document.getElementById("img");
            const button = document.getElementById("startButton");

            let pause = true;

            button.addEventListener("click", () => {
                let click = new Audio("click.mp3");
                click.play();
                if (pause) {
                    let interval = document.getElementById("interval").value;
                    image.style.animationPlayState = "running";
                    image.style.animationDuration = interval * 2 + "s";

                    button.innerHTML = "Stop"; // Update button text
                    pause = false;
                } else {
                    image.style.animationPlayState = "paused";
                    button.textContent = "Move";
                    pause = true;
                }
            });
        </script>
    </body>
</html>
